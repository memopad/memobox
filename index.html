<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>주크박스</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>주크박스</h1>
      <div class="topbar-right">
        <span id="room-label" class="room-label">방 확인 중</span>
        <div class="identity" id="my-identity" hidden>
          <span>내 ID: <strong id="my-name">게스트</strong></span>
          <span class="role">웹 청취자</span>
          <button type="button" id="leave-button">나가기</button>
        </div>
      </div>
    </header>

    <section id="join-card" class="join-panel" aria-labelledby="join-title">
      <h2 id="join-title">주크박스 입장</h2>
      <form id="join-form">
        <label for="nickname">닉네임</label>
        <div class="join-row">
          <input id="nickname" maxlength="30" autocomplete="nickname" placeholder="닉네임" required>
          <button type="submit">입장</button>
        </div>
      </form>
      <p class="feedback" id="join-error" role="alert" hidden></p>
    </section>

    <section id="listener-app" class="workspace" hidden aria-label="주크박스 청취 화면">
      <div class="jb-grid">
        <section class="jb-player-column" aria-label="음악 재생">
          <div id="video-wrap"><div id="youtube-player"></div></div>
          <div class="jb-now-row">
            <button type="button" class="icon-button fold-button" id="toggle-extras" title="재생 정보 접기" aria-label="재생 정보 접기" aria-expanded="true" aria-controls="player-details">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="jb-current">
              <h2 id="track-title">재생 중인 곡 없음</h2>
              <div class="track-subline"><span id="track-time">0:00</span><span aria-hidden="true">·</span><span id="repeat-label">전체 반복</span></div>
            </div>
            <button type="button" class="icon-button listen-button" id="allow-play" title="음악 듣기" aria-label="음악 듣기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <button type="button" class="icon-button fold-button" id="toggle-library-reopen" title="플레이리스트 펼치기" aria-label="플레이리스트 펼치기" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
          </div>
          <div id="player-details" class="jb-player-details">
            <div class="jb-controls-row">
              <span class="playback-state" id="playing-badge">대기 중</span>
              <label class="volume"><span>개인 볼륨</span><input id="volume" type="range" min="0" max="100" value="70" aria-label="개인 볼륨"><output id="volume-value">70%</output></label>
            </div>
            <div class="progress" aria-label="곡 재생 진행률"><div id="progress-fill"></div></div>
            <div class="connection" id="live-pill"><span class="connection-mark" aria-hidden="true"></span><span id="connection-status" role="status" aria-live="polite">연결 준비 중</span></div>
          </div>
        </section>

        <aside class="jb-library" id="playlist-column" aria-label="플레이리스트와 청취자">
          <div class="jb-playlist-heading">
            <nav id="playlist-tabs" class="jb-tabs" aria-label="플레이리스트 탭"></nav>
            <button type="button" class="icon-button fold-button" id="toggle-library" title="플레이리스트 접기" aria-label="플레이리스트 접기" aria-expanded="true" aria-controls="playlist-column">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
            </button>
          </div>
          <div class="queue" id="queue"><p class="empty">곡 목록 없음</p></div>
          <section class="jb-section">
            <div class="section-heading"><strong>듣고 있는 사람</strong><span id="listener-count">0</span></div>
            <div class="listener-list" id="listeners-list"><p class="empty">없음</p></div>
          </section>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
